# 墨读 · Cloudflare 后端（D1 登录持久化 + R2 + Workers AI）
# 本地: npm run cf:dev
# 发布: npm run cf:deploy

name = "modu-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "modu-books"
preview_bucket_name = "modu-books-preview"

[[d1_databases]]
binding = "DB"
database_name = "modu"
# 首次: npx wrangler d1 create modu  → 把返回的 database_id 填到下一行
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "00000000-0000-0000-0000-000000000001"

[ai]
binding = "AI"

[vars]
# 前端正式域名（登录 cookie / OAuth redirect 用）
APP_ORIGIN = "https://modu.grok.me"
ALLOWED_ORIGINS = "https://modu.grok.me,http://localhost:8080,http://127.0.0.1:8080"
AI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
# 可选: GROK_AUTH_ISSUER = "https://auth.grok.me"

# 密钥（勿提交）:
#   npx wrangler secret put MODU_API_SECRET
#   npx wrangler secret put BETTER_AUTH_SECRET
#   npx wrangler secret put GROK_AUTH_CLIENT_ID
#   npx wrangler secret put GROK_AUTH_CLIENT_SECRET
# 本地 cloudflare/.dev.vars:
#   MODU_API_SECRET=dev-secret
#   BETTER_AUTH_SECRET=dev-auth-secret-change-me
#   GROK_AUTH_CLIENT_ID=
#   GROK_AUTH_CLIENT_SECRET=
